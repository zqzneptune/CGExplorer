name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v0.3.2)'
        required: true
        default: 'v0.3.2'

permissions:
  contents: write

jobs:
  build:
    name: Build Multi-OS Packages
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release'}
          - {os: macOS-latest,   r: 'release'}
          - {os: ubuntu-latest,  r: 'release'}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}

      - name: Set up R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck

      - name: Build package
        shell: Rscript {0}
        run: |
          dir.create("dist", showWarnings = FALSE)
          bin_pkg <- pkgbuild::build(binary = TRUE, dest_path = "dist")
          src_pkg <- pkgbuild::build(binary = FALSE, dest_path = "dist")
          message("Built binary: ", bin_pkg)
          message("Built source: ", src_pkg)
          print(list.files("dist", full.names = TRUE))

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.config.os }}
          path: dist/

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-merged
          pattern: pkg-*
          merge-multiple: true

      - name: Determine tag name
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: List files to release
        run: |
          mkdir -p dist-merged
          ls -la dist-merged/

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: CGExplorer ${{ steps.get_tag.outputs.tag }}
          body: |
            ## CGExplorer ${{ steps.get_tag.outputs.tag }}

            ### Installation:
            
            **Windows users (binary without compilation tools):**
            ```R
            install.packages("https://github.com/zqzneptune/CGExplorer/releases/download/${{ steps.get_tag.outputs.tag }}/CGExplorer_0.3.2.zip", repos = NULL, type = "win.binary")
            ```

            **macOS users (Apple Silicon):**
            ```R
            install.packages("https://github.com/zqzneptune/CGExplorer/releases/download/${{ steps.get_tag.outputs.tag }}/CGExplorer_0.3.2.tgz", repos = NULL, type = "mac.binary")
            ```

            **Source package (all platforms):**
            ```R
            install.packages("https://github.com/zqzneptune/CGExplorer/releases/download/${{ steps.get_tag.outputs.tag }}/CGExplorer_0.3.2.tar.gz", repos = NULL, type = "source")
            ```
          files: dist-merged/*
